<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicPulse — Local Information Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <header class="header-bar">
      <div class="brand-wrapper" id="btn-brand-home">
        <div class="brand-pin-icon" data-icon="mapPin" data-size="md"></div>
        <div>
          <div class="brand-title-text">CivicPulse</div>
          <div class="brand-sub-text">Local Information Network</div>
        </div>
      </div>

      <div class="header-search-box">
        <span class="header-search-icon" data-icon="search" data-size="sm"></span>
        <input type="text" class="header-search-input" id="global-search-input" placeholder="Search internships, road issues, events, lost items…">
        <span class="header-search-kbd">⌘ K</span>
      </div>

      <div class="header-right-actions">
        <a href="admin.html" class="btn btn-admin" title="Open Admin &amp; Moderation Dashboard">
          <span data-icon="shieldCheck" data-size="sm"></span>
          <span>Admin Desk</span>
        </a>

        <button class="btn-share-info" id="btn-open-create">
          <span data-icon="plus" data-size="sm"></span>
          <span>Share Information</span>
        </button>

        <button class="header-icon-btn" id="btn-toggle-theme" title="Toggle light / dark theme"></button>

        <button class="header-icon-btn" title="Notifications">
          <span data-icon="bell" data-size="md"></span>
        </button>

        <div class="header-user-profile" id="btn-toggle-role" title="Click to switch role (Resident / Moderator)">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="avatar" class="header-user-avatar" id="header-avatar-img">
          <div>
            <div class="header-user-name" id="header-user-name">Rahul Sharma</div>
            <div class="header-user-role" id="header-user-role">Resident</div>
          </div>
        </div>
      </div>
    </header>

    <div class="main-wrapper">
      <aside class="left-sidebar">
        <div class="sidebar-scroll-content">
          <div class="top-nav-group">
            <div class="nav-pill-item" id="nav-home">
              <span class="nav-pill-icon" data-icon="home" data-size="md"></span>
              <span>Home</span>
            </div>
            <div class="nav-pill-item" id="nav-feed">
              <span class="nav-pill-icon" data-icon="feed" data-size="md"></span>
              <span>Information Feed</span>
            </div>
            <div class="nav-pill-item" id="nav-mod">
              <span class="nav-pill-icon" data-icon="shield" data-size="md"></span>
              <span>Moderation Desk</span>
            </div>
          </div>

          <div id="sidebar-categories-container" class="sidebar-categories"></div>
        </div>
      </aside>

      <main class="center-feed-area" id="center-main-area"></main>
    </div>
  </div>

  <div id="modals-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
