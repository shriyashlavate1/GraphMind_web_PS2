<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicPulse - Local Information Network</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header Bar -->
    <header class="header-bar">
      <!-- Brand -->
      <div class="brand-wrapper" id="btn-brand-home">
        <div class="brand-pin-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/>
            <circle cx="12" cy="10" r="3" fill="#0284c7"/>
          </svg>
        </div>
        <div>
          <div class="brand-title-text">CivicPulse</div>
          <div class="brand-sub-text">Local Information Network</div>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="header-search-box">
        <span class="header-search-icon">🔍</span>
        <input type="text" class="header-search-input" id="global-search-input" placeholder="Search for internships, road issues, events, lost items...">
        <span class="header-search-kbd">⌘ K</span>
      </div>

      <!-- Right Actions -->
      <div class="header-right-actions">
        <button class="btn-share-info" id="btn-open-create">
          <span style="font-size:15px;line-height:1;">+</span>
          <span>Share Information</span>
        </button>

        <!-- Theme Toggle -->
        <button class="header-icon-btn" id="btn-toggle-theme" title="Toggle Light / Dark theme">
          ☀️
        </button>

        <!-- Notifications -->
        <button class="header-icon-btn" title="Notifications">
          🔔
        </button>

        <!-- User Profile -->
        <div class="header-user-profile" id="btn-toggle-role" title="Click to switch role (Resident / Moderator)">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="avatar" class="header-user-avatar" id="header-avatar-img">
          <div>
            <div class="header-user-name" id="header-user-name">Rahul Sharma</div>
            <div class="header-user-role" id="header-user-role">Resident</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content: Sidebar + Center Feed -->
    <div class="main-wrapper">
      <!-- Left Sidebar Navigation -->
      <aside class="left-sidebar">
        <div class="sidebar-scroll-content">
          <!-- Top Nav Group -->
          <div class="top-nav-group">
            <div class="nav-pill-item" id="nav-home">
              <span class="nav-pill-icon">🏠</span>
              <span>Home</span>
            </div>
            <div class="nav-pill-item" id="nav-feed">
              <span class="nav-pill-icon">📋</span>
              <span>Information Feed</span>
            </div>
            <div class="nav-pill-item" id="nav-mod">
              <span class="nav-pill-icon">🛡️</span>
              <span>Moderation Desk</span>
            </div>
          </div>

          <!-- Channel Categories Container -->
          <div id="sidebar-categories-container" style="display:flex;flex-direction:column;gap:16px;">
            <!-- Populated dynamically by app.js -->
          </div>
        </div>
      </aside>

      <!-- Center Main Information Feed -->
      <main class="center-feed-area" id="center-main-area">
        <!-- Rendered dynamically -->
      </main>
    </div>
  </div>

  <!-- Modals Container -->
  <div id="modals-root"></div>

  <!-- Pure Plain JavaScript Scripts -->
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
